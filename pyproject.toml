[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rugix-apps-examples"
version = "0.1.0"
description = "Industrial Rugix Apps examples and test tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
