[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rugix-apps-examples"
version = "0.1.0"
description = "Rugix Apps examples and test tooling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vm = ["rugix-testkit @ git+https://github.com/rugix/rugix-testkit.git@118e7ba4e418e7d3adeafccad0314e043c239154"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
