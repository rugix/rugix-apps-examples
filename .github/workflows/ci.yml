name: CI

on:
  # Pull requests cover other branches, so that their pushes do not run twice.
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Run tests
        run: mise run test

  app-bundles:
    name: Build App Bundles (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Build app bundles
        env:
          RUGIX_DIST_DIR: ${{ github.workspace }}/build/${{ matrix.arch }}
          RUGIX_PLATFORM: ${{ matrix.platform }}
        run: mise run build

      - name: Collect release assets
        env:
          ARCH: ${{ matrix.arch }}
        run: mise run release:collect

      - name: Upload app bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-bundles-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - app-bundles
    if: github.ref_type == 'tag'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download app bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
              echo "[ERROR] no release assets found"
              exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --clobber
          else
              gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "${GITHUB_REF_NAME}" \
                  --notes "Prebuilt Rugix Apps examples for ${GITHUB_SHA}."
          fi

  publish-nexigon-staging:
    name: Publish to Nexigon Staging
    runs-on: ubuntu-latest
    needs:
      - publish-release
    if: github.ref_type == 'tag'
    environment: nexigon-staging
    concurrency:
      group: nexigon-staging-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Download app bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish app bundles
        env:
          NEXIGON_REPOSITORY: default
          NEXIGON_STAGING_TOKEN: ${{ secrets.NEXIGON_STAGING_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${NEXIGON_STAGING_TOKEN}" ]; then
              echo "[ERROR] NEXIGON_STAGING_TOKEN is not configured"
              exit 1
          fi

          config="${RUNNER_TEMP}/nexigon-cli.toml"
          trap 'rm -f "${config}"' EXIT
          (
              umask 077
              printf 'hub-url = "https://staging.nexigon.dev"\ntoken = "%s"\n' \
                  "${NEXIGON_STAGING_TOKEN}" >"${config}"
          )
          NEXIGON_CLI_CONFIG="${config}" mise run publish
